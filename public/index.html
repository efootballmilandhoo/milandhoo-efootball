<style>#splash{position:fixed;inset:0;z-index:9999;cursor:pointer;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#fff}
.no-splash #splash{display:none}
.sp-stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden;background:linear-gradient(180deg,#0B1B3F 0%,#08142F 55%,#050D22 100%)}
.sp-outline{position:absolute;left:50%;top:42%;width:min(84vw,720px);transform:translate(-50%,-50%);opacity:.22;overflow:visible}
.sp-outline path{stroke-dasharray:1;stroke-dashoffset:1;animation:spTrace 1s cubic-bezier(.45,0,.2,1) forwards}
.sp-outline path:nth-child(2){animation-delay:.06s}.sp-outline path:nth-child(3){animation-delay:.12s}.sp-outline path:nth-child(4){animation-delay:.18s}
@keyframes spTrace{to{stroke-dashoffset:0}}
.sp-glow{position:absolute;left:50%;top:42%;width:520px;height:520px;margin:-260px 0 0 -260px;border-radius:50%;background:radial-gradient(closest-side,rgba(20,99,255,.28),rgba(20,99,255,0));}
.sp-content{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;padding:0 24px;margin-top:-3vh}
.sp-slot{width:96px;height:96px;flex-shrink:0}
.sp-logo{position:fixed;left:50%;top:40%;width:96px;height:96px;z-index:2;border-radius:24px;overflow:hidden;background:#0E2350;display:grid;place-items:center;
  box-shadow:0 1px 0 rgba(255,255,255,.04),0 2px 4px rgba(0,0,0,.35),0 10px 22px -6px rgba(0,0,0,.6),0 26px 48px -14px rgba(2,8,24,.9),0 18px 60px -18px rgba(20,99,255,.75);
  transform:perspective(600px) translateY(10px) rotateX(16deg) scale(.94);opacity:0;animation:spLift .75s cubic-bezier(.2,.8,.2,1) forwards}
/* glass: soft light from the top, darker toward the bottom, a fine bright top edge */
.sp-logo::before{content:"";position:absolute;inset:0;z-index:1;border-radius:inherit;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.16) 0%,rgba(255,255,255,.05) 38%,rgba(255,255,255,0) 52%,rgba(0,0,0,.18) 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.28),inset 0 0 0 1px rgba(255,255,255,.07),inset 0 -2px 6px rgba(0,0,0,.35)}
/* one quiet light sweep */
.sp-logo::after{content:"";position:absolute;inset:-40%;z-index:1;pointer-events:none;background:linear-gradient(115deg,transparent 44%,rgba(255,255,255,.22) 50%,transparent 56%);transform:translateX(-110%);animation:spSheen 1s cubic-bezier(.4,0,.2,1) .45s forwards}
@keyframes spLift{to{opacity:1;transform:perspective(600px) translateY(0) rotateX(0) scale(1)}}
@keyframes spSheen{to{transform:translateX(110%)}}
/* soft glow on the "floor" under the logo */
.sp-slot{position:relative}
.sp-slot::after{content:"";position:absolute;left:50%;top:100%;width:140%;height:34px;margin:6px 0 0 -70%;border-radius:50%;background:radial-gradient(closest-side,rgba(20,99,255,.45),rgba(20,99,255,0));opacity:0;animation:spFade .8s ease .2s forwards}
.sp-logo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.sp-logo svg{width:58%;height:58%;display:none}
.sp-logo.noimg svg{display:block}
.sp-name{margin-top:28px;font-family:"Barlow Condensed","Arial Narrow",Inter,sans-serif;font-weight:800;font-size:38px;line-height:1;letter-spacing:.08em;margin-right:-.08em;white-space:nowrap;opacity:0;transform:translateY(6px);animation:spIn .5s cubic-bezier(.2,.8,.2,1) .1s forwards}
.sp-sub{margin-top:10px;font-size:11px;font-weight:600;letter-spacing:.32em;margin-right:-.32em;text-transform:uppercase;color:#93A9D6;opacity:0;animation:spFade .5s ease .25s forwards}
.sp-slogan{margin-top:24px;display:flex;align-items:center;gap:12px;font-size:12px;font-weight:600;letter-spacing:.3em;margin-right:-.3em;text-transform:uppercase;color:#C9D5EE;opacity:0;animation:spFade .5s ease .4s forwards}
.sp-slogan b{width:3px;height:3px;border-radius:50%;background:#5EC8FF}
.sp-foot{position:absolute;left:0;right:0;bottom:calc(46px + env(safe-area-inset-bottom));display:flex;justify-content:center;opacity:0;animation:spFade .4s ease .5s forwards}
.sp-bar{width:72px;height:2px;border-radius:2px;background:rgba(255,255,255,.1);overflow:hidden}
.sp-bar i{display:block;height:100%;width:40%;border-radius:2px;background:#5EC8FF;animation:spLoad 1.1s cubic-bezier(.5,0,.5,1) infinite}
@keyframes spIn{to{opacity:1;transform:none}}
@keyframes spFade{to{opacity:1}}
@keyframes spLoad{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
@media (min-width:700px){.sp-slot,.sp-logo{width:112px;height:112px}.sp-logo{border-radius:28px}.sp-name{font-size:46px}.sp-slogan{font-size:13px}}
@media (max-width:350px){.sp-name{font-size:34px}.sp-slogan{font-size:10.5px;letter-spacing:.24em;gap:9px}}
.sp-fast #splash *,#splash.fast *{animation-duration:.01s!important;animation-delay:0s!important}
.sp-fast #splash .sp-bar i,#splash.fast .sp-bar i{animation-duration:1.1s!important}
@media (prefers-reduced-motion:reduce){#splash *{animation-duration:.01s!important;animation-delay:0s!important;animation-iteration-count:1!important}}

/* exit: the sheet's lower edge gets rounded corners and a shadow while it lifts */
#splash.lifting{border-radius:0 0 28px 28px;overflow:hidden;box-shadow:0 30px 80px rgba(2,8,24,.55);will-change:transform}
.sp-shade{position:fixed;inset:0;z-index:9998;pointer-events:none;background:rgba(5,12,32,.55)}</style>

<script>(function(){
  var tpl = document.getElementById('splash'); if(!tpl) return;
  var H = document.documentElement;
  if(H.classList.contains('no-splash')){ tpl.remove(); return }
  /* The community logo: the one the app last showed (remembered), else the app icon, which is cached with the app. */
  var FALLBACK = '/icons/icon-512.png?v=2', logoSrc = FALLBACK;
  try{ var L = localStorage.getItem('mg-logo'); if(L && /^(https:|\/)/.test(L)) logoSrc = L }catch(e){}
  var html = tpl.outerHTML, rm = matchMedia('(prefers-reduced-motion: reduce)').matches;
  function play(s, fast){
    var img = s.querySelector('.sp-logo img'), box = s.querySelector('.sp-logo'), slot = s.querySelector('.sp-slot');
    img.onerror = function(){ if(img.getAttribute('src') !== FALLBACK) img.src = FALLBACK; else { img.remove(); box.classList.add('noimg') } };
    img.src = logoSrc;
    if(fast) s.classList.add('fast');
    /* Short: leaves once the first screen is drawn (about 1.6 s), sooner never, and never later than 3 s. */
    var MIN = rm || fast ? 300 : 1000, MAX = 2200, t0 = Date.now(), leaving = false;
    var outline = s.querySelector('.sp-outline');
    function place(){ var r = slot.getBoundingClientRect(); box.style.left = r.left+'px'; box.style.top = r.top+'px'; box.style.width = r.width+'px'; box.style.height = r.height+'px'; if(outline){ var ow = Math.max(160, Math.min(innerWidth*.84, 640, (r.top-48)*.78/.2914)); outline.style.width = ow+'px'; outline.style.top = (r.top*.5 + 4)+'px' } }
    place(); addEventListener('resize', place);
    if(document.fonts && document.fonts.ready) document.fonts.ready.then(place);
    function drawn(){ return !!(window.__splashDrawn || window.__splashOffline) }
    /* The header logo that is on screen now (phone header or desktop sidebar). */
    function target(){
      var els = document.querySelectorAll('.mobile-header [data-mark] .logo-mark, .sidebar [data-mark] .logo-mark');
      for(var i=0;i<els.length;i++){ var r = els[i].getBoundingClientRect(); if(r.width>8 && r.bottom>0 && r.top<innerHeight && r.right>0 && r.left<innerWidth && getComputedStyle(els[i]).visibility!=='hidden') return els[i] }
      return null;
    }
    function enter(){ window.__splashUp = false; if(window.playEnter) try{ playEnter() }catch(e){} }
    function leave(){
      if(leaving) return; leaving = true; clearInterval(poll); removeEventListener('resize', place);
      if(rm || !s.animate){ s.style.transition = 'opacity .3s ease'; s.style.opacity = 0; enter(); setTimeout(function(){ s.remove() }, 320); return }
      var stage = s.querySelector('.sp-stage'), content = s.querySelector('.sp-content'), outlineEl = s.querySelector('.sp-outline'), foot = s.querySelector('.sp-foot');
      var tg = target();
      if(tg){
        /* The logo glides into the logo in the header while everything else dissolves into the app. */
        var a = box.getBoundingClientRect(), b = tg.getBoundingClientRect(), k = b.width / a.width;
        var glide = 'cubic-bezier(.65,0,.35,1)', D = 640;
        tg.style.visibility = 'hidden';
        box.style.transformOrigin = '0 0';
        box.animate([
          {transform:'translate(0,0) scale(1)', boxShadow:getComputedStyle(box).boxShadow},
          {transform:'translate('+(b.left-a.left)+'px,'+(b.top-a.top)+'px) scale('+k+')', boxShadow:'0 0 0 0 rgba(0,0,0,0),0 0 0 0 rgba(0,0,0,0),0 0 0 0 rgba(0,0,0,0),0 0 0 0 rgba(0,0,0,0),0 0 0 0 rgba(0,0,0,0)'}
        ], {duration:D, easing:glide, fill:'forwards'}).onfinish = function(){
          tg.style.visibility = '';
          box.animate([{opacity:1}, {opacity:0}], {duration:160, easing:'ease-out', fill:'forwards'}).onfinish = function(){ s.remove() };
        };
        content.animate([{opacity:1, transform:'none'}, {opacity:0, transform:'translateY(12px) scale(.98)'}], {duration:260, easing:'cubic-bezier(.4,0,.2,1)', fill:'forwards'});
        if(outlineEl) outlineEl.animate([{opacity:getComputedStyle(outlineEl).opacity}, {opacity:0}], {duration:240, fill:'forwards'});
        if(foot) foot.animate([{opacity:1}, {opacity:0}], {duration:150, fill:'forwards'});
        stage.animate([{opacity:1}, {opacity:0}], {duration:480, delay:120, easing:'cubic-bezier(.4,0,.2,1)', fill:'forwards'});
        setTimeout(enter, 160);
        setTimeout(function(){ tg.style.visibility = ''; if(s.parentNode) s.remove() }, D + 600);
        return;
      }
      /* Lift: the splash slides up like a card being pulled away, its content moving a little faster (depth),
         while a shade over the app clears. Only transform and opacity, so it stays smooth. */
      var content = s.querySelector('.sp-content'), outlineEl = s.querySelector('.sp-outline'), foot = s.querySelector('.sp-foot');
      var lift = 'cubic-bezier(.7,0,.2,1)', D = 520;
      var shade = document.createElement('div'); shade.className = 'sp-shade'; document.body.appendChild(shade);
      s.classList.add('lifting');
      s.animate([{transform:'translateY(0)'}, {transform:'translateY(-104%)'}], {duration:D, easing:lift, fill:'forwards'}).onfinish = function(){ s.remove() };
      [content, box, outlineEl].forEach(function(el){ if(el) el.animate([{transform:el===box ? 'none' : getComputedStyle(el).transform === 'none' ? 'none' : getComputedStyle(el).transform, opacity:1}, {transform:(el===box || el===content ? 'translateY(-60px)' : getComputedStyle(el).transform+' translateY(-40px)'), opacity:0}], {duration:D*.7, easing:lift, fill:'forwards'}) });
      if(foot) foot.animate([{opacity:1}, {opacity:0}], {duration:150, fill:'forwards'});
      shade.animate([{opacity:1}, {opacity:0}], {duration:D, delay:60, easing:'cubic-bezier(.4,0,.2,1)', fill:'forwards'}).onfinish = function(){ shade.remove() };
      setTimeout(enter, 120);
      setTimeout(function(){ if(s.parentNode) s.remove(); if(shade.parentNode) shade.remove() }, D + 400);
    }
    var poll = setInterval(function(){ if(Date.now()-t0 >= MIN && drawn()) leave() }, 80);
    setTimeout(leave, MAX);
    s.addEventListener('click', leave);
    window.__splashUp = true;
  }
  play(tpl, H.classList.contains('sp-fast'));
  /* Opening the app again after it has been in the background for a while plays it again. */
  var hiddenAt = 0;
  document.addEventListener('visibilitychange', function(){
    if(document.hidden){ hiddenAt = Date.now(); return }
    if(hiddenAt && Date.now()-hiddenAt > 5*60e3 && !document.getElementById('splash')){
      var d = document.createElement('div'); d.innerHTML = html; var s = d.firstElementChild; document.body.appendChild(s); play(s, false);
    }
    hiddenAt = 0;
  });
})();</script>
