<style>#splash{position:fixed;inset:0;z-index:9999;cursor:pointer;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#fff}
.no-splash #splash{display:none}
.sp-stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#050C22;will-change:opacity,transform}
.sp-bg{position:absolute;inset:0;background:radial-gradient(55% 40% at 50% 44%,rgba(20,99,255,.34),rgba(20,99,255,0) 70%),linear-gradient(155deg,#0C1F4A 0%,#06102A 50%,#030918 100%)}
/* eFootball-style motion: big slanted light bands (the same lean as the logo's slashes), speed streaks and a dot grid */
.sp-fx{position:absolute;inset:0;overflow:hidden;-webkit-mask-image:radial-gradient(60% 34% at 50% 46%,rgba(0,0,0,.18) 30%,#000 100%);mask-image:radial-gradient(60% 34% at 50% 46%,rgba(0,0,0,.18) 30%,#000 100%)}
.sp-band{position:absolute;left:50%;top:50%;width:var(--w);height:240vmax;margin-top:-120vmax;opacity:0;
  background:linear-gradient(180deg,rgba(20,99,255,0) 20%,rgba(20,99,255,.30) 44%,rgba(94,200,255,.22) 52%,rgba(20,99,255,0) 80%);
  transform:translateX(var(--x)) rotate(30deg);animation:spBand 1.2s cubic-bezier(.16,1,.3,1) var(--d) forwards}
.sp-band.thin{background:linear-gradient(180deg,rgba(94,200,255,0) 25%,rgba(94,200,255,.38) 48%,rgba(94,200,255,0) 75%)}
.sp-streak{position:absolute;left:50%;top:50%;width:2px;height:26vmax;border-radius:2px;opacity:0;
  background:linear-gradient(180deg,rgba(94,200,255,0),rgba(150,220,255,.9),rgba(94,200,255,0));
  transform:translate(var(--x),70vh) rotate(30deg);animation:spStreak 1.5s cubic-bezier(.5,0,.5,1) var(--d) infinite}
.sp-grid{position:absolute;inset:0;opacity:0;background-image:radial-gradient(rgba(120,160,240,.45) 1px,transparent 1.3px);background-size:18px 18px;
  -webkit-mask-image:radial-gradient(42% 32% at 50% 44%,#000,transparent);mask-image:radial-gradient(42% 32% at 50% 44%,#000,transparent);animation:spGridIn 1.4s ease .3s forwards}
.sp-content{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;padding:0 24px;margin-top:-4vh;will-change:opacity,transform}
.sp-slot{width:104px;height:104px;flex-shrink:0}
.sp-logo{position:fixed;left:50%;top:40%;width:104px;height:104px;z-index:2;border-radius:26px;overflow:hidden;background:#0E2350;display:grid;place-items:center;will-change:opacity,transform;
  box-shadow:0 0 0 1px rgba(255,255,255,.08),0 24px 60px -12px rgba(20,99,255,.6);opacity:0;animation:spLogo .8s cubic-bezier(.16,1,.3,1) .2s forwards}
.sp-logo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.sp-logo svg{width:58%;height:58%;display:none}
.sp-logo.noimg svg{display:block}
.sp-logo::after{content:"";position:absolute;inset:-30%;z-index:2;background:linear-gradient(120deg,transparent 42%,rgba(255,255,255,.38) 50%,transparent 58%);transform:translateX(-120%);animation:spSheen 1.1s ease 1s forwards}
.sp-name{margin-top:30px;height:44px;line-height:44px;font-family:"Barlow Condensed","Arial Narrow",Inter,sans-serif;font-weight:800;font-size:42px;white-space:nowrap;letter-spacing:.06em;margin-right:-.06em;opacity:0;transform:translateY(14px);animation:spUp .7s cubic-bezier(.16,1,.3,1) .6s forwards}
.sp-sub{margin-top:8px;font-size:11px;font-weight:700;letter-spacing:.34em;margin-right:-.34em;text-transform:uppercase;color:#8FB0EC;opacity:0;animation:spFade .7s ease .85s forwards}
.sp-rule{width:44px;height:2px;margin-top:18px;border-radius:2px;background:linear-gradient(90deg,#1463FF,#5EC8FF);transform:scaleX(0);animation:spGrow .6s cubic-bezier(.16,1,.3,1) 1.05s forwards}
.sp-slogan{margin-top:16px;height:20px;display:flex;align-items:center;gap:12px;font-size:12.5px;font-weight:600;letter-spacing:.34em;margin-right:-.34em;text-transform:uppercase;color:#C3D2F0}
.sp-slogan span{opacity:0;animation:spFade .6s ease forwards}
.sp-slogan span:nth-child(1){animation-delay:1.2s}.sp-slogan span:nth-child(3){animation-delay:1.35s}.sp-slogan span:nth-child(5){animation-delay:1.5s}
.sp-slogan i{width:3px;height:3px;border-radius:50%;background:#5EC8FF;opacity:0;animation:spFade .6s ease 1.35s forwards}
.sp-foot{position:absolute;left:0;right:0;bottom:calc(44px + env(safe-area-inset-bottom));display:flex;justify-content:center;opacity:0;animation:spFade .8s ease 1s forwards}
.sp-bar{width:96px;height:2px;border-radius:2px;background:rgba(255,255,255,.10);overflow:hidden}
.sp-bar b{display:block;height:100%;width:40%;border-radius:2px;background:linear-gradient(90deg,#1463FF,#5EC8FF);animation:spLoad 1.2s cubic-bezier(.5,0,.5,1) infinite}
@keyframes spBand{0%{opacity:0;transform:translateX(calc(var(--x) - 26vmax)) rotate(30deg)}100%{opacity:1;transform:translateX(var(--x)) rotate(30deg)}}
@keyframes spStreak{0%{opacity:0;transform:translate(var(--x),70vh) rotate(30deg)}25%{opacity:.9}100%{opacity:0;transform:translate(calc(var(--x) + 75vh),-130vh) rotate(30deg)}}
@keyframes spLogo{0%{opacity:0;transform:scale(.8)}100%{opacity:1;transform:none}}
@keyframes spSheen{to{transform:translateX(120%)}}
@keyframes spUp{to{opacity:1;transform:none}}
@keyframes spGrow{to{transform:none}}
@keyframes spFade{to{opacity:1}}
@keyframes spLoad{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
@media (max-width:420px){.sp-name{font-size:38px}}
@media (min-width:700px){.sp-slot,.sp-logo{width:120px;height:120px}.sp-logo{border-radius:30px}.sp-name{font-size:50px;height:52px;line-height:52px}.sp-slogan{font-size:13.5px}}
@media (max-width:350px){.sp-name{font-size:36px}.sp-slogan{font-size:11px;letter-spacing:.26em;gap:9px}}
/* Coming back after an automatic update: no intro, straight to the finished screen. */
.sp-fast #splash *,#splash.fast *{animation-duration:.01s!important;animation-delay:0s!important}
.sp-fast #splash .sp-streak,.sp-fast #splash .sp-bar b,#splash.fast .sp-streak,#splash.fast .sp-bar b{animation-duration:1.5s!important}
@media (prefers-reduced-motion:reduce){#splash *{animation-duration:.01s!important;animation-delay:0s!important;animation-iteration-count:1!important}.sp-streak{display:none}}
@keyframes spGridIn{to{opacity:.5}}</style>

<script>(function(){
  var tpl = document.getElementById('splash'); if(!tpl) return;
  var H = document.documentElement;
  if(H.classList.contains('no-splash')){ tpl.remove(); return }
  /* The community logo: the one the app last showed (remembered), else the app icon, which is cached with the app. */
  var FALLBACK = '/icons/icon-512.png?v=2', logoSrc = FALLBACK;
  try{ var L = localStorage.getItem('mg-logo'); if(L && /^(https:|\/)/.test(L)) logoSrc = L }catch(e){}
  var html = tpl.outerHTML, rm = matchMedia('(prefers-reduced-motion: reduce)').matches;
  function play(s, fast){
    var img = s.querySelector('.sp-logo img'), box = s.querySelector('.sp-logo'), slot = s.querySelector('.sp-slot');
    img.onerror = function(){ if(img.getAttribute('src') !== FALLBACK) img.src = FALLBACK; else { img.remove(); box.classList.add('noimg') } };
    img.src = logoSrc;
    if(fast) s.classList.add('fast');
    var MIN = rm || fast ? 700 : 2400, MAX = 6000;
    var t0 = Date.now(), gone = false, leaving = false;
    function place(){ var r = slot.getBoundingClientRect(); box.style.left = r.left+'px'; box.style.top = r.top+'px'; box.style.width = r.width+'px'; box.style.height = r.height+'px' }
    place(); addEventListener('resize', place);
    if(document.fonts && document.fonts.ready) document.fonts.ready.then(place);
    function finish(){ if(gone) return; gone = true; removeEventListener('resize', place); s.remove(); window.__splashUp = false }

    function appReady(){ var S = window.STORE; return !!(window.__splashOffline || (S && S.live && window.__splashDrawn)) }

      if(rm || !s.animate){ s.style.transition = 'opacity .45s ease'; s.style.opacity = 0; window.__splashUp = false; if(window.playEnter) try{ playEnter() }catch(e){} setTimeout(finish, 470); return }
      /* Two frames after the last render, so nothing else is drawing while it fades. */
      requestAnimationFrame(function(){ requestAnimationFrame(function(){
        var ease = 'cubic-bezier(.4,0,.2,1)';
        content.animate([{opacity:1, transform:'none'}, {opacity:0, transform:'translateY(-8px)'}], {duration:380, easing:ease, fill:'forwards'});
        box.animate([{opacity:1, transform:'none'}, {opacity:0, transform:'scale(1.35)'}], {duration:620, delay:60, easing:ease, fill:'forwards'});

})();</script>
