<div id="splash" aria-hidden="true">
  <div class="sp-stage">
    <svg class="sp-outline" viewBox="-8 -8 1949 568" fill="none" stroke="#5EC8FF" stroke-width="6" stroke-linejoin="miter">
      <path pathLength="1" d="M552 0H758L206 552H0Z"/>
      <path pathLength="1" d="M821 0H1026L474 552H269Z"/>
      <path pathLength="1" d="M1089 0H1295L743 552H537Z"/>
      <path pathLength="1" d="M1396 0H1933L1795 138H1464L1188 414H1521L1383 552H847Z"/>
    </svg>
    <div class="sp-glow"></div>
    <div class="sp-content">
      <div class="sp-slot"></div>
      <div class="sp-name">MG EFOOTBALL</div>
      <div class="sp-sub">Milandhoo Community</div>
      <div class="sp-slogan"><span>Play</span><b></b><span>Compete</span><b></b><span>Belong</span></div>
    </div>
    <div class="sp-foot"><div class="sp-bar"><i></i></div></div>
  </div>
  <div class="sp-logo">
    <svg viewBox="0 0 24 24" fill="none" stroke="#3D8BFF" stroke-width="2.6" stroke-linejoin="round"><path d="M3 19V5l9 8 9-8v14"/></svg>
    <img alt="">
  </div>
</div>
<script>(function(){
  var tpl = document.getElementById('splash'); if(!tpl) return;
  var H = document.documentElement;
  if(H.classList.contains('no-splash')){ tpl.remove(); return }
  /* The community logo: the one the app last showed (remembered), else the app icon, which is cached with the app. */
  var FALLBACK = '/icons/icon-512.png?v=2', logoSrc = FALLBACK;
  try{ var L = localStorage.getItem('mg-logo'); if(L && /^(https:|\/)/.test(L)) logoSrc = L }catch(e){}
  var html = tpl.outerHTML, rm = matchMedia('(prefers-reduced-motion: reduce)').matches;
  function play(s, fast){
    var img = s.querySelector('.sp-logo img'), box = s.querySelector('.sp-logo'), slot = s.querySelector('.sp-slot');
    img.onerror = function(){ if(img.getAttribute('src') !== FALLBACK) img.src = FALLBACK; else { img.remove(); box.classList.add('noimg') } };
    img.src = logoSrc;
    if(fast) s.classList.add('fast');
    /* Short: leaves once the first screen is drawn (about 1.6 s), sooner never, and never later than 3 s. */
    var MIN = rm || fast ? 300 : 1000, MAX = 2200, t0 = Date.now(), leaving = false;
    var outline = s.querySelector('.sp-outline');
    function place(){ var r = slot.getBoundingClientRect(); box.style.left = r.left+'px'; box.style.top = r.top+'px'; box.style.width = r.width+'px'; box.style.height = r.height+'px'; if(outline){ var ow = Math.max(160, Math.min(innerWidth*.84, 640, (r.top-48)*.78/.2914)); outline.style.width = ow+'px'; outline.style.top = (r.top*.5 + 4)+'px' } }
    place(); addEventListener('resize', place);
    if(document.fonts && document.fonts.ready) document.fonts.ready.then(place);
    function drawn(){ return !!(window.__splashDrawn || window.__splashOffline) }
    /* The header logo that is on screen now (phone header or desktop sidebar). */
    function target(){
      var els = document.querySelectorAll('.mobile-header [data-mark] .logo-mark, .sidebar [data-mark] .logo-mark');
      for(var i=0;i<els.length;i++){ var r = els[i].getBoundingClientRect(); if(r.width>8 && r.bottom>0 && r.top<innerHeight && r.right>0 && r.left<innerWidth && getComputedStyle(els[i]).visibility!=='hidden') return els[i] }
      return null;
    }
    function enter(){ window.__splashUp = false; if(window.playEnter) try{ playEnter() }catch(e){} }
    function leave(){
      if(leaving) return; leaving = true; clearInterval(poll); removeEventListener('resize', place);
      if(rm || !s.animate){ s.style.transition = 'opacity .3s ease'; s.style.opacity = 0; enter(); setTimeout(function(){ s.remove() }, 320); return }
      var stage = s.querySelector('.sp-stage'), content = s.querySelector('.sp-content'), outlineEl = s.querySelector('.sp-outline'), foot = s.querySelector('.sp-foot');
      var tg = target();
      if(tg){
        /* The logo glides into the logo in the header while everything else dissolves into the app. */
        var a = box.getBoundingClientRect(), b = tg.getBoundingClientRect(), k = b.width / a.width;
        var glide = 'cubic-bezier(.65,0,.35,1)', D = 640;
        tg.style.visibility = 'hidden';
        box.style.transformOrigin = '0 0';
        box.animate([
          {transform:'translate(0,0) scale(1)', boxShadow:getComputedStyle(box).boxShadow},
          {transform:'translate('+(b.left-a.left)+'px,'+(b.top-a.top)+'px) scale('+k+')', boxShadow:'0 0 0 0 rgba(0,0,0,0),0 0 0 0 rgba(0,0,0,0),0 0 0 0 rgba(0,0,0,0),0 0 0 0 rgba(0,0,0,0),0 0 0 0 rgba(0,0,0,0)'}
        ], {duration:D, easing:glide, fill:'forwards'}).onfinish = function(){
          tg.style.visibility = '';
          box.animate([{opacity:1}, {opacity:0}], {duration:160, easing:'ease-out', fill:'forwards'}).onfinish = function(){ s.remove() };
        };
        content.animate([{opacity:1, transform:'none'}, {opacity:0, transform:'translateY(12px) scale(.98)'}], {duration:260, easing:'cubic-bezier(.4,0,.2,1)', fill:'forwards'});
        if(outlineEl) outlineEl.animate([{opacity:getComputedStyle(outlineEl).opacity}, {opacity:0}], {duration:240, fill:'forwards'});
        if(foot) foot.animate([{opacity:1}, {opacity:0}], {duration:150, fill:'forwards'});
        stage.animate([{opacity:1}, {opacity:0}], {duration:480, delay:120, easing:'cubic-bezier(.4,0,.2,1)', fill:'forwards'});
        setTimeout(enter, 160);
        setTimeout(function(){ tg.style.visibility = ''; if(s.parentNode) s.remove() }, D + 600);
        return;
      }
      /* Lift: the splash slides up like a card being pulled away, its content moving a little faster (depth),
         while a shade over the app clears. Only transform and opacity, so it stays smooth. */
      var content = s.querySelector('.sp-content'), outlineEl = s.querySelector('.sp-outline'), foot = s.querySelector('.sp-foot');
      var lift = 'cubic-bezier(.7,0,.2,1)', D = 520;
      var shade = document.createElement('div'); shade.className = 'sp-shade'; document.body.appendChild(shade);
      s.classList.add('lifting');
      s.animate([{transform:'translateY(0)'}, {transform:'translateY(-104%)'}], {duration:D, easing:lift, fill:'forwards'}).onfinish = function(){ s.remove() };
      [content, box, outlineEl].forEach(function(el){ if(el) el.animate([{transform:el===box ? 'none' : getComputedStyle(el).transform === 'none' ? 'none' : getComputedStyle(el).transform, opacity:1}, {transform:(el===box || el===content ? 'translateY(-60px)' : getComputedStyle(el).transform+' translateY(-40px)'), opacity:0}], {duration:D*.7, easing:lift, fill:'forwards'}) });
      if(foot) foot.animate([{opacity:1}, {opacity:0}], {duration:150, fill:'forwards'});
      shade.animate([{opacity:1}, {opacity:0}], {duration:D, delay:60, easing:'cubic-bezier(.4,0,.2,1)', fill:'forwards'}).onfinish = function(){ shade.remove() };
      setTimeout(enter, 120);
      setTimeout(function(){ if(s.parentNode) s.remove(); if(shade.parentNode) shade.remove() }, D + 400);
    }
    var poll = setInterval(function(){ if(Date.now()-t0 >= MIN && drawn()) leave() }, 80);
    setTimeout(leave, MAX);
    s.addEventListener('click', leave);
    window.__splashUp = true;
  }
  play(tpl, H.classList.contains('sp-fast'));
  /* Opening the app again after it has been in the background for a while plays it again. */
  var hiddenAt = 0;
  document.addEventListener('visibilitychange', function(){
    if(document.hidden){ hiddenAt = Date.now(); return }
    if(hiddenAt && Date.now()-hiddenAt > 5*60e3 && !document.getElementById('splash')){
      var d = document.createElement('div'); d.innerHTML = html; var s = d.firstElementChild; document.body.appendChild(s); play(s, false);
    }
    hiddenAt = 0;
  });
})();</script>
