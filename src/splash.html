<div id="splash" aria-hidden="true">
  <div class="sp-stage">
    <div class="sp-bg"></div>
    <i class="sp-panel l"></i><i class="sp-panel r"></i>
    <i class="sp-edge e1"></i><i class="sp-edge e2"></i><i class="sp-edge e3"></i>
    <i class="sp-streak s1"></i><i class="sp-streak s2"></i>
    <div class="sp-content">
      <div class="sp-slot"></div>
      <div class="sp-name"><span>MG EFOOTBALL</span></div>
      <div class="sp-sub">Milandhoo Community</div>
      <div class="sp-tabs"><span>Play</span><span class="hot">Compete</span><span>Belong</span></div>
    </div>
    <div class="sp-foot"><div class="sp-bar"><b></b></div></div>
    <i class="sp-cut c1"></i><i class="sp-cut c2"></i><i class="sp-cut c3"></i>
  </div>
  <div class="sp-logo">
    <svg viewBox="0 0 24 24" fill="none" stroke="#3D8BFF" stroke-width="2.6" stroke-linejoin="round"><path d="M3 19V5l9 8 9-8v14"/></svg>
    <img alt="">
  </div>
</div>
<script>(function(){
  var tpl = document.getElementById('splash'); if(!tpl) return;
  var H = document.documentElement;
  if(H.classList.contains('no-splash')){ tpl.remove(); return }
  /* The community logo: the one the app last showed (remembered), else the app icon, which is cached with the app. */
  var FALLBACK = '/icons/icon-512.png?v=2', logoSrc = FALLBACK;
  try{ var L = localStorage.getItem('mg-logo'); if(L && /^(https:|\/)/.test(L)) logoSrc = L }catch(e){}
  var html = tpl.outerHTML, rm = matchMedia('(prefers-reduced-motion: reduce)').matches;
  function play(s, fast){
    var img = s.querySelector('.sp-logo img'), box = s.querySelector('.sp-logo'), slot = s.querySelector('.sp-slot');
    img.onerror = function(){ if(img.getAttribute('src') !== FALLBACK) img.src = FALLBACK; else { img.remove(); box.classList.add('noimg') } };
    img.src = logoSrc;
    if(fast) s.classList.add('fast');
    /* Short: leaves once the first screen is drawn (about 1.6 s), sooner never, and never later than 3 s. */
    var MIN = rm || fast ? 400 : 1400, MAX = 2800, t0 = Date.now(), leaving = false;
    function place(){ var r = slot.getBoundingClientRect(); box.style.left = r.left+'px'; box.style.top = r.top+'px'; box.style.width = r.width+'px'; box.style.height = r.height+'px' }
    place(); addEventListener('resize', place);
    if(document.fonts && document.fonts.ready) document.fonts.ready.then(place);
    function drawn(){ return !!(window.__splashDrawn || window.__splashOffline) }
    function enter(){ window.__splashUp = false; if(window.playEnter) try{ playEnter() }catch(e){} }
    function leave(){
      if(leaving) return; leaving = true; clearInterval(poll); removeEventListener('resize', place);
      if(rm || !s.animate){ s.style.transition = 'opacity .3s ease'; s.style.opacity = 0; enter(); setTimeout(function(){ s.remove() }, 320); return }
      /* eFootball-style wipe: slanted slabs sweep in, the app is swapped in underneath, and they sweep out. */
      var w = document.createElement('div'); w.className = 'sp-wipe';
      w.innerHTML = '<i class="w1"></i><i class="w2"></i><i class="w3"></i>';
      document.body.appendChild(w);
      var W = innerWidth, Hh = innerHeight, slabs = w.children, inEase = 'cubic-bezier(.5,0,.15,1)', outEase = 'cubic-bezier(.7,0,.5,1)';
      var span = W + Hh*.38 + 24;
      [].forEach.call(slabs, function(el, i){
        var wd = i===2 ? span : i===1 ? span*.45 : span*.22, from = -wd - Hh*.3, to = W + Hh*.3;
        el.style.width = wd + 'px';
        if(i < 2){ el.animate([{transform:'translateX('+from+'px) skewX(-20deg)'}, {transform:'translateX('+to+'px) skewX(-20deg)'}], {duration:520, delay:i*40, easing:'cubic-bezier(.55,0,.35,1)', fill:'forwards'}); return }
        /* One continuous motion (runs smoothly even while the app is being drawn underneath). */
        var mid = -Hh*.19 - 12, D = 620, cover = .45;
        el.animate([
          {transform:'translateX('+from+'px) skewX(-20deg)', offset:0, easing:'cubic-bezier(.3,0,.2,1)'},
          {transform:'translateX('+mid+'px) skewX(-20deg)', offset:cover, easing:'linear'},
          {transform:'translateX('+(mid+6)+'px) skewX(-20deg)', offset:.5, easing:'cubic-bezier(.6,0,.4,1)'},
          {transform:'translateX('+to+'px) skewX(-20deg)', offset:1}
        ], {duration:D, delay:60, fill:'forwards'}).onfinish = function(){ w.remove() };
        setTimeout(function(){ s.remove(); enter() }, 60 + D*cover + 16);
      });
      setTimeout(function(){ if(s.parentNode) s.remove(); if(w.parentNode) w.remove(); enter() }, 1400);
    }
    var poll = setInterval(function(){ if(Date.now()-t0 >= MIN && drawn()) leave() }, 80);
    setTimeout(leave, MAX);
    s.addEventListener('click', leave);
    window.__splashUp = true;
  }
  play(tpl, H.classList.contains('sp-fast'));
  /* Opening the app again after it has been in the background for a while plays it again. */
  var hiddenAt = 0;
  document.addEventListener('visibilitychange', function(){
    if(document.hidden){ hiddenAt = Date.now(); return }
    if(hiddenAt && Date.now()-hiddenAt > 5*60e3 && !document.getElementById('splash')){
      var d = document.createElement('div'); d.innerHTML = html; var s = d.firstElementChild; document.body.appendChild(s); play(s, false);
    }
    hiddenAt = 0;
  });
})();</script>
