<div id="splash" aria-hidden="true">
  <div class="sp-stage">
    <div class="sp-bg"></div>
    <div class="sp-fx">
      <i class="sp-band" style="--x:-46vw;--w:7vmax;--d:.05s"></i>
      <i class="sp-band thin" style="--x:-36vw;--w:3vmax;--d:.15s"></i>
      <i class="sp-band thin" style="--x:-29vw;--w:1.4vmax;--d:.25s"></i>
      <i class="sp-band" style="--x:30vw;--w:9vmax;--d:.1s"></i>
      <i class="sp-band thin" style="--x:42vw;--w:2.4vmax;--d:.2s"></i>
      <i class="sp-streak" style="--x:-30vw;--d:.4s"></i>
      <i class="sp-streak" style="--x:8vw;--d:.9s"></i>
      <i class="sp-streak" style="--x:34vw;--d:.65s"></i>
      <i class="sp-streak" style="--x:-8vw;--d:1.3s"></i>
    </div>
    <div class="sp-grid"></div>
    <div class="sp-content">
      <div class="sp-slot"></div>
      <div class="sp-name">MG EFOOTBALL</div>
      <div class="sp-sub">Milandhoo Community</div>
      <div class="sp-rule"></div>
      <div class="sp-slogan"><span>Play</span><i></i><span>Compete</span><i></i><span>Belong</span></div>
    </div>
    <div class="sp-foot"><div class="sp-bar"><b></b></div></div>
  </div>
  <div class="sp-logo">
    <svg viewBox="0 0 24 24" fill="none" stroke="#3D8BFF" stroke-width="2.6" stroke-linejoin="round"><path d="M3 19V5l9 8 9-8v14"/></svg>
    <img alt="">
  </div>
</div>
<script>(function(){
  var tpl = document.getElementById('splash'); if(!tpl) return;
  var H = document.documentElement;
  if(H.classList.contains('no-splash')){ tpl.remove(); return }
  /* The community logo: the one the app last showed (remembered), else the app icon, which is cached with the app. */
  var FALLBACK = '/icons/icon-512.png?v=2', logoSrc = FALLBACK;
  try{ var L = localStorage.getItem('mg-logo'); if(L && /^(https:|\/)/.test(L)) logoSrc = L }catch(e){}
  var html = tpl.outerHTML, rm = matchMedia('(prefers-reduced-motion: reduce)').matches;
  function play(s, fast){
    var img = s.querySelector('.sp-logo img'), box = s.querySelector('.sp-logo'), slot = s.querySelector('.sp-slot');
    img.onerror = function(){ if(img.getAttribute('src') !== FALLBACK) img.src = FALLBACK; else { img.remove(); box.classList.add('noimg') } };
    img.src = logoSrc;
    if(fast) s.classList.add('fast');
    var MIN = rm || fast ? 700 : 2400, MAX = 6000;
    var t0 = Date.now(), gone = false, leaving = false;
    function place(){ var r = slot.getBoundingClientRect(); box.style.left = r.left+'px'; box.style.top = r.top+'px'; box.style.width = r.width+'px'; box.style.height = r.height+'px' }
    place(); addEventListener('resize', place);
    if(document.fonts && document.fonts.ready) document.fonts.ready.then(place);
    function finish(){ if(gone) return; gone = true; removeEventListener('resize', place); s.remove(); window.__splashUp = false }
    /* The app is ready once its first screen is drawn and live data has arrived (or it is offline). */
    function appReady(){ var S = window.STORE; return !!(window.__splashOffline || (S && S.live && window.__splashDrawn)) }
    function leave(){
      if(leaving) return; leaving = true; clearInterval(poll);
      var stage = s.querySelector('.sp-stage'), content = s.querySelector('.sp-content');
      if(rm || !s.animate){ s.style.transition = 'opacity .45s ease'; s.style.opacity = 0; window.__splashUp = false; if(window.playEnter) try{ playEnter() }catch(e){} setTimeout(finish, 470); return }
      /* Two frames after the last render, so nothing else is drawing while it fades. */
      requestAnimationFrame(function(){ requestAnimationFrame(function(){
        var ease = 'cubic-bezier(.4,0,.2,1)';
        content.animate([{opacity:1, transform:'none'}, {opacity:0, transform:'translateY(-8px)'}], {duration:380, easing:ease, fill:'forwards'});
        box.animate([{opacity:1, transform:'none'}, {opacity:0, transform:'scale(1.35)'}], {duration:620, delay:60, easing:ease, fill:'forwards'});
        stage.animate([{opacity:1, transform:'none'}, {opacity:0, transform:'scale(1.06)'}], {duration:700, delay:140, easing:ease, fill:'forwards'}).onfinish = finish;
        setTimeout(function(){ window.__splashUp = false; if(window.playEnter) try{ playEnter() }catch(e){} }, 300);
        setTimeout(finish, 1100);
      }) });
    }
    var poll = setInterval(function(){ if(Date.now()-t0 >= MIN && appReady()) leave() }, 120);
    setTimeout(leave, MAX);
    s.addEventListener('click', leave);
    window.__splashUp = true;
  }
  play(tpl, H.classList.contains('sp-fast'));
  /* Opening the app again after it has been in the background for a while plays it again. */
  var hiddenAt = 0;
  document.addEventListener('visibilitychange', function(){
    if(document.hidden){ hiddenAt = Date.now(); return }
    if(hiddenAt && Date.now()-hiddenAt > 5*60e3 && !document.getElementById('splash')){
      var w = document.createElement('div'); w.innerHTML = html; var s = w.firstElementChild; document.body.appendChild(s); window.__splashDrawn = true; play(s, false);
    }
    hiddenAt = 0;
  });
})();</script>
